name: Bug Report
description: Report an issue or unexpected behavior in PG-Manager
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out this form to help us diagnose and resolve the issue efficiently.

  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Authentication / Access Control
        - Public Discovery & Search
        - Tenant Onboarding / Applications
        - Room & Bed Allocation Matrix
        - Invoicing & Financial Billing
        - Complaints & Ticket Dispatch
        - Staff Cleaning / Maintenance Logs
        - SuperAdmin Multi-Property Governance
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed sequence of actions to reproduce the bug.
      placeholder: |
        1. Navigate to '...'
        2. Click on '....'
        3. Enter '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Browser, Operating System, Node version if applicable.
      placeholder: Chrome 124, Windows 11, Node 20.x
    validations:
      required: false
